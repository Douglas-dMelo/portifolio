<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Formulário</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
    }

    .form-container {
        max-width: 500px;
        margin: 50px auto;
        background: #1562c7f8;
        padding: 30px;
        border-radius: 10px;
    }

    label {
        display: block;
        margin-top: 15px;
        color: #fff;
        font-size: 14px;
    }

    input, textarea {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border-radius: 5px;
        border: none;
        outline: none;
        font-size: 14px;
    }

    input:invalid, textarea:invalid {
        border: 2px solid #1562c7f8;
    }

    input:valid, textarea:valid {
        border: 2px solid #0d0e0d;
    }

    button {
        margin-top: 20px;
        width: 100%;
        padding: 12px;
        background: hsl(0, 0%, 0%);
        border: none;
        color: #fff;
        font-size: 16px;
        cursor: pointer;
        border-radius: 5px;
    }

    button:hover {
        background: #43a047;
    }
</style>
</head>

<body>

<div class="form-container">
    <form action="#" method="post">
        
        <label for="nome">Nome</label>
        <input 
            type="text" 
            id="nome" 
            name="nome" 
            placeholder="Seu nome completo"
            required 
            minlength="3">

        <label for="email">Email</label>
        <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="seuemail@empresa.com"
            required>

        <label for="mensagem">Mensagem</label>
        <textarea 
            id="mensagem" 
            name="mensagem" 
            rows="4"
            placeholder="Digite sua mensagem"
            required 
            minlength="10"></textarea>

        <button type="submit">Enviar</button>

    </form>
</div>

</body>
</html>
